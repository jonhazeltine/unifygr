<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-label="Flower Power Trucker Hat in Avocado and Cream">
  <title>Flower Power Trucker Hat</title>

  <!-- Drop shadow -->
  <ellipse cx="161" cy="202" rx="106" ry="8" fill="#1a1008" opacity="0.13"/>

  <!-- BRIM (drawn first, sits behind hat body) -->
  <path d="M78 150 Q161 167 244 150 L237 163 Q161 182 65 163 Z" fill="#3d2410" stroke="#1a1008" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Brim top face -->
  <ellipse cx="161" cy="150" rx="83" ry="9" fill="#5c3a1e" stroke="#1a1008" stroke-width="2.5"/>

  <!-- LEFT MESH PANEL -->
  <path d="M80 150 C60 127 62 88 76 62 C88 42 110 36 122 36 L124 150 Z" fill="#d8ceae" stroke="#1a1008" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#b0a888" stroke-width="0.8" opacity="0.9">
    <path d="M87 143 C83 118 79 94 77 70"/>
    <path d="M98 147 C95 120 92 94 91 66"/>
    <path d="M111 149 C109 122 108 94 107 62"/>
    <line x1="82" y1="128" x2="113" y2="124"/>
    <line x1="80" y1="108" x2="112" y2="103"/>
    <line x1="78" y1="88" x2="110" y2="83"/>
  </g>

  <!-- RIGHT MESH PANEL -->
  <path d="M242 150 C262 127 260 88 246 62 C234 42 212 36 200 36 L198 150 Z" fill="#d8ceae" stroke="#1a1008" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#b0a888" stroke-width="0.8" opacity="0.9">
    <path d="M235 143 C239 118 243 94 245 70"/>
    <path d="M224 147 C227 120 230 94 231 66"/>
    <path d="M211 149 C213 122 214 94 215 62"/>
    <line x1="240" y1="128" x2="209" y2="124"/>
    <line x1="242" y1="108" x2="210" y2="103"/>
    <line x1="244" y1="88" x2="212" y2="83"/>
  </g>

  <!-- FRONT FOAM PANEL (avocado green) -->
  <path d="M122 150 L112 36 Q161 20 210 36 L200 150 Z" fill="#7a8c3a" stroke="#1a1008" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sweatband seam -->
  <line x1="122" y1="150" x2="200" y2="150" stroke="#1a1008" stroke-width="2"/>

  <!-- CROWN BUTTON -->
  <circle cx="161" cy="26" r="8" fill="#3d2410" stroke="#1a1008" stroke-width="2.5"/>

  <!-- DAISY FLOWER -->
  <g transform="translate(161,92)">
    <ellipse rx="7" ry="22" fill="#fdf6e3" stroke="#1a1008" stroke-width="1.8"/>
    <ellipse rx="7" ry="22" fill="#ede5cc" stroke="#1a1008" stroke-width="1.8" transform="rotate(45)"/>
    <ellipse rx="7" ry="22" fill="#fdf6e3" stroke="#1a1008" stroke-width="1.8" transform="rotate(90)"/>
    <ellipse rx="7" ry="22" fill="#ede5cc" stroke="#1a1008" stroke-width="1.8" transform="rotate(135)"/>
    <!-- center yellow -->
    <circle r="14" fill="#f5c800" stroke="#1a1008" stroke-width="2"/>
    <!-- center dot -->
    <circle r="6" fill="#e05c00"/>
    <circle cx="-2" cy="-2" r="1.5" fill="#c45000" opacity="0.6"/>
    <circle cx="2.5" cy="1.5" r="1.5" fill="#c45000" opacity="0.6"/>
    <circle cx="-1" cy="3.5" r="1.5" fill="#c45000" opacity="0.6"/>
  </g>

  <!-- "JOY" embroidery text -->
  <text x="161" y="142" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="16" font-weight="900" fill="#e05c00" stroke="#1a1008" stroke-width="0.8" paint-order="stroke fill" letter-spacing="5">JOY</text>

  <!-- SNAP BACK CLOSURE -->
  <rect x="137" y="160" width="48" height="11" rx="3" fill="#3d2410" stroke="#1a1008" stroke-width="1.5"/>
  <rect x="151" y="162.5" width="18" height="5.5" rx="2" fill="#7a8c3a" stroke="#1a1008" stroke-width="1"/>
</svg>
